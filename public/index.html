<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>فيد — متابعة التلاميذ</title>
  <meta name="theme-color" content="#61038d">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="icon" href="feed-icon.png">
  <link rel="apple-touch-icon" href="feed-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar" id="topbar" hidden>
    <a class="brand" href="#/"><img src="feed-logo-white.png" alt="فيد"><span>متابعة التلاميذ</span></a>
    <nav id="nav"></nav>
    <div id="subnav" class="subnav" hidden></div>
    <div class="who">
      <span id="who-name"></span>
      <button class="btn ghost small" id="logout">خروج</button>
    </div>
  </header>

  <main id="view" class="container"></main>

  <dialog id="modal">
    <form method="dialog" id="modal-form" novalidate>
      <h3 id="modal-title"></h3>
      <div id="modal-body"></div>
      <p class="error" id="modal-error" hidden></p>
      <div class="actions">
        <button type="submit" class="btn" value="ok">حفظ</button>
        <button type="button" class="btn ghost" id="modal-cancel">إلغاء</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" hidden></div>

  <script src="app.js"></script>
</body>
</html>
