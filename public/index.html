<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>فيد — متابعة التلاميذ</title>
  <meta name="theme-color" content="#61038d">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Tajawal:wght@500;700;800&family=Oswald:wght@600&family=Great+Vibes&display=swap" rel="stylesheet">
  <link rel="icon" href="feed-icon.png">
  <link rel="apple-touch-icon" href="feed-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar" id="topbar" hidden>
    <a class="brand" href="#/"><img class="logo-light" src="feed-logo-white.png" alt="فيد"><img class="logo-dark" src="feed-logo.png" alt="فيد"><span>متابعة التلاميذ</span></a>
    <nav id="nav"></nav>
    <div id="subnav" class="subnav" hidden></div>
    <button type="button" class="menu-toggle" id="menu-toggle" aria-expanded="false" aria-controls="vmenu" hidden>
      <span class="burger" aria-hidden="true"></span><span>القائمة</span>
    </button>
    <div class="who">
      <button type="button" class="switch-pill" id="switch-btn" hidden></button>
      <a href="#/arena" class="bell arena-icon" id="arena-btn" title="🏆 ركن التحدّي" hidden>🏆</a>
      <a href="#/messages" class="bell" id="mail" title="الرسائل">✉️<span id="mail-count" hidden></span></a>
      <a href="#/alerts" class="bell" id="bell" title="التنبيهات" hidden>🔔<span id="bell-count" hidden></span></a>
      <span id="who-name"></span>
      <button class="btn ghost small" id="logout">خروج</button>
    </div>
  </header>
  <aside id="vmenu" class="vmenu" hidden></aside>

  <main id="view" class="container"></main>
  <nav id="tabbar" class="tabbar" hidden></nav>

  <dialog id="modal">
    <form method="dialog" id="modal-form" novalidate>
      <h3 id="modal-title"></h3>
      <div id="modal-body"></div>
      <p class="error" id="modal-error" hidden></p>
      <div class="actions">
        <button type="submit" class="btn" value="ok">حفظ</button>
        <button type="button" class="btn ghost" id="modal-cancel">إلغاء</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" hidden></div>

  <script src="app.js"></script>
  <script src="business.js"></script>
  <script src="center.js"></script>
  <script src="evaluation.js"></script>
  <script src="messages.js"></script>
  <script src="home.js"></script>
  <script src="google.js"></script>
  <script src="game.js"></script>
  <script src="vendor/qrcode.js"></script>
  <script src="polls.js"></script>
</body>
</html>
